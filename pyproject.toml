[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-session-helper"
version = "0.2.0"
description = "Local isolated desktop sessions for Windows, macOS and Linux"
requires-python = ">=3.11"
readme = "PACKAGE.md"

[project.scripts]
deskhelper = "desktop_session_helper.deskhelper:entrypoint"

[tool.setuptools]
packages = ["desktop_session_helper"]
include-package-data = false

[tool.setuptools.package-dir]
desktop_session_helper = "."

[tool.setuptools.package-data]
desktop_session_helper = ["linux/adapter.py", "windows/adapter.py", "windows/Worker.cs", "windows/NativeSupport.cs", "macos/adapter.py", "macos/vm_adapter.py", "macos/runtime_paths.py", "macos/build.py", "macos/build_vm.py", "macos/*.swift", "macos/*.entitlements", "macos/guest_bootstrap.sh", "macos/README.md", "macos/SETUP.md", "macos/NATIVE_OR_VM.md", "macos/PROVISIONING.md", "linux/README.md", "windows/README.md", "windows/SETUP.md", "CONTRACT.md", "session.schema.json"]
