name: Feature request
description: Propose a concrete isolated-desktop workflow.
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow and platform
      description: What should an agent or human be able to do, and on which backend?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable success
      description: How would a real app and host-isolation test prove it works?
