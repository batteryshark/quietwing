name: Draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag, for example v0.3.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Verify tag matches package
        env:
          QW_TAG: ${{ inputs.tag }}
        run: |
          python -c 'import os,tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["QW_TAG"] == "v"+v, "Tag/version mismatch"'
      - run: python scripts/check.py
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/check_distribution.py dist
      - name: Check installed wheel
        run: |
          python -m pip install --no-deps dist/*.whl
          python scripts/check_installed.py
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QW_TAG: ${{ inputs.tag }}
        run: gh release create "$QW_TAG" --verify-tag --draft --title "QuietWing $QW_TAG" --notes-file CHANGELOG.md dist/*
