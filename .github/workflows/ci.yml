name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Portable checks (no native desktop)
        run: python scripts/check.py
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install wheel without runtime dependencies
        shell: bash
        run: python -m pip install --no-deps dist/*.whl
      - name: Check installed command from a fresh directory
        run: python scripts/check_installed.py

  distributions:
    name: Distribution audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - name: Build wheel and source archive
        run: python -m build
      - name: Inspect contents and generate checksums
        run: python scripts/check_distribution.py dist
      - name: Rebuild and install from source archive
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/quietwing-rebuilt dist/*.tar.gz
          python -m pip install --no-deps /tmp/quietwing-rebuilt/*.whl
          python scripts/check_installed.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quietwing-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
